name: alpha-daily

# Alpha(Claude)의 하루. CLAUDE.md "일일 루프" 참조.
#
# 14:00 KST 한 번 실행하고, 그 안에서 두 단계를 순서대로 돈다:
#   /alpha-scan     버그 탐지 · 코드 리뷰 · 보안 점검 · 리서치 → 지시서를 러너 디스크에 씀
#   /alpha-handoff  새 컨텍스트로 지시서를 재점검 → Slack #request 에 게시
#
# **지시서는 커밋되지 않는다.** 이 리포는 public이고, 지시서에는 아직 안 고친 결함의
# 위치가 들어간다. 러너 안에서만 존재하다가 Slack으로 나가고 러너와 함께 사라진다.
# (그래서 두 단계를 별도 워크플로 실행으로 쪼갤 수 없다 — 실행 간에 파일을 넘기려면
#  아티팩트를 써야 하는데 public 리포에서는 그것도 노출 경로다.)
#
# 두 단계를 굳이 나눠 부르는 이유: 재점검이 새 컨텍스트에서 돌아야 의미가 있다.
# 같은 세션이 자기가 쓴 걸 다시 읽으면 자기 판정이지 재점검이 아니다.
#
# cron은 UTC로만 돈다. KST = UTC+9 이므로 14:00 KST 는 당일 05:00 UTC 다.
# 스크립트 안에서 날짜를 만들 때는 반드시 TZ=Asia/Seoul 을 붙여라 — 안 붙이면 하루 밀린다.

on:
  schedule:
    - cron: "0 5 * * *" # 14:00 KST
  workflow_dispatch:

concurrency:
  group: alpha-daily
  cancel-in-progress: false

permissions:
  contents: write # P0 보안 수정을 claude/v3.0.N 브랜치로 올릴 때만 쓴다
  pull-requests: write

jobs:
  daily:
    name: 14:00 scan and handoff
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          # next-branch.sh 가 원격 브랜치를 세야 한다.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure git identity
        run: |
          git config user.name  "biolabs3-alpha"
          git config user.email "noreply@anthropic.com"

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Scan
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 권한 프롬프트는 무인 실행에서 답할 사람이 없어 건너뛴다.
          # 파괴적 명령은 프롬프트가 아니라 .claude/hooks/guard-destructive.sh 가
          # PreToolUse 에서 결정론적으로 막는다 — 훅은 이 플래그와 무관하게 계속 돈다.
          claude -p "/alpha-scan" \
            --dangerously-skip-permissions \
            --output-format stream-json --verbose

      - name: Check the scan produced something
        run: |
          REPORT="reports/requests/$(TZ=Asia/Seoul date +%Y-%m-%d).md"
          if [[ -s "$REPORT" ]]; then
            echo "OK: $REPORT ($(wc -l <"$REPORT") lines)"
          else
            echo "::error::alpha-scan 이 $REPORT 를 남기지 않았다. 인계할 것이 없다."
            exit 1
          fi

      - name: Handoff to Slack
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          claude -p "/alpha-handoff" \
            --dangerously-skip-permissions \
            --output-format stream-json --verbose

      - name: Report scan failure to Slack
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          # 실패를 조용히 넘기면 사장도 Cursor도 오늘 인계가 없다는 걸 모른다.
          # 지어낸 지시서 대신 실패 사실만 올린다.
          mkdir -p "$RUNNER_TEMP"
          printf '# biolabs3 · Alpha\n\n오늘(%s) 일일 루프가 실패했다. 인계할 내용이 없다.\n\n실행 로그: %s/%s/actions/runs/%s\n' \
            "$(TZ=Asia/Seoul date +%Y-%m-%d)" \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" \
            > "$RUNNER_TEMP/alpha-fail.md"
          bash scripts/post-to-slack.sh "$RUNNER_TEMP/alpha-fail.md"

      - name: Shred the work order
        if: always()
        run: |
          # 러너는 어차피 회수되지만, 이후 스텝이나 캐시 업로드에 섞여 나가지 않게
          # 명시적으로 지운다. 지시서는 Slack 밖 어디에도 남지 않는다.
          rm -rf reports/
